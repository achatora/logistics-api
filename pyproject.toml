[project]
name = "logistics-api"
version = "0.1.0"
description = "Logistics management and shipment tracking API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pyright",
]

